name: Deploy bnc-site

on:
  pull_request:
    paths: ['.github/**']
  push:
    branches: ["main"]
    paths-ignore: ['.github/**']
  workflow_dispatch: {}

concurrency:
  group: deploy-bnc-site
  cancel-in-progress: true

jobs:
  runner-smoke:
    runs-on: ci
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify the cluster runner tools
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_ENVIRONMENT" = self-hosted
          node --version
          python3 --version
          ssh -V
  # Workflow-only PRs prove routing without deploying an old application.
  deploy:
    if: github.event_name != 'pull_request'
    needs: runner-smoke
    runs-on: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 159.223.224.43 >> ~/.ssh/known_hosts

      - name: Upload repo to ~/bnc-site on server
        shell: bash
        run: |
          set -euo pipefail
          # The cluster image provides OpenSSH and tar. Keep rsync's exact
          # replacement semantics on the existing server, where it is installed.
          tar --exclude=.git --exclude=.github -czf "$RUNNER_TEMP/bnc-site.tar.gz" .
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/bnc-site.tar.gz" ${{ secrets.DEPLOY_USER }}@159.223.224.43:~/bnc-site-incoming.tar.gz
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ${{ secrets.DEPLOY_USER }}@159.223.224.43 'bash -se' <<'EOF'
            set -euo pipefail
            staging=$(mktemp -d)
            trap 'rm -rf "$staging"; rm -f "$HOME/bnc-site-incoming.tar.gz"' EXIT
            tar -xzf "$HOME/bnc-site-incoming.tar.gz" -C "$staging"
            mkdir -p "$HOME/bnc-site"
            rsync -a --delete --exclude=.git/ --exclude=.github/ "$staging/" "$HOME/bnc-site/"
          EOF

      - name: Publish to /var/www/bnc-site (sudo)
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ${{ secrets.DEPLOY_USER }}@159.223.224.43 << 'EOF'
            set -euo pipefail
            sudo mkdir -p /var/www/bnc-site
            sudo rsync -az --delete ~/bnc-site/ /var/www/bnc-site/
          EOF
